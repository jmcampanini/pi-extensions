{{! A user prompt or agent response. Markdown is rendered before it reaches this component. }}
<article class="message {{role}}" id="{{id}}">
	{{#if label}}
		<div class="message-meta"><span>{{label}}</span></div>
	{{/if}}
	{{#if status}}
		<p class="message-status">{{status}}</p>
	{{/if}}
	{{> copy-button sourceId=sourceId variant="copy-message" label=copyLabel title="Copy Markdown"}}
	<div class="markdown">{{{markdownHtml}}}</div>
	<textarea hidden id="{{sourceId}}">{{source}}</textarea>
</article>
