{{! Calls arrive newest first, with plain-text arguments and recorded result states. }}
<details class="activity" aria-label="Tool activity">
	<summary class="activity-summary">{{summary}}</summary>
	<ul>
		{{#each calls}}
			<li>
				<code>{{name}}</code>
				<span class="tool-argument">{{argument}}</span>
				<span class="tool-state {{status}}">{{statusLabel}}</span>
			</li>
		{{/each}}
	</ul>
</details>
