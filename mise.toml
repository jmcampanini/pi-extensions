# The oldest mise release that reads lockfile revision 4, which mise.lock uses.
min_version = "2026.11.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Each tool a task runs is pinned to an exact version, the latest release of its supported line, so every machine runs the same build.
# package-lock.json locks tsc and vitest, so they have no pin here.
[tools]
jactionlint = { version = "2.5.0", workflow = "release.yaml" }
node = "26.13.0"
"npm:markdownlint-cli2" = "0.24.0"

[env]
_.path = ["node_modules/.bin"]

[tasks.install]
description = "Install the npm packages package-lock.json locks."
hide = true
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.typecheck]
description = "Typecheck the extensions."
depends = ["install"]
run = "tsc --noEmit"

[tasks.test]
description = "Run the extension tests."
depends = ["install"]
run = "vitest run"

[tasks.lint-workflows]
description = "Lint GitHub Actions configuration for correctness."
run = "jactionlint --profile correctness --no-online --shellcheck= --pyflakes="

[tasks.lint-markdown]
description = "Lint tracked Markdown using the shared Markdown rules."
run = "git ls-files -z -- '*.md' '*.markdown' | xargs -0 markdownlint-cli2"

# check runs every report-only task and writes only under ignored paths, so CI can assert a clean checkout after it.
[tasks.check]
description = "Run the complete local verification contract."
depends = ["lint-markdown", "lint-workflows", "test", "typecheck"]
