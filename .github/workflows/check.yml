name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Record working tree state
        run: git status --porcelain --untracked-files=all > "$RUNNER_TEMP/porcelain-before"

      - name: Check
        run: mise run check

      - name: Verify check left the working tree unchanged
        if: always()
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/porcelain-after"
          diff -u "$RUNNER_TEMP/porcelain-before" "$RUNNER_TEMP/porcelain-after"
